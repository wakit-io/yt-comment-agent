# JAREE 프론트 = SvelteKit(SSR) · adapter-netlify
# publish=build(정적 자산), SSR은 .netlify/functions-internal/sveltekit-render 로 자동 번들.
# adapter가 build/_redirects에 catch-all(* → SSR 함수)을 생성하므로 모든 동적 라우트
# (/, /@slug, /@slug/mcp, /mcp, /master/mcp, /oauth/*, /.well-known/*, /api/*, 페이지)가
# SvelteKit 라우터로 들어간다 → 라이브와 URL 완전 동일(커넥터 보존).
#
# ★호환 리다이렉트는 adapter 규칙상 netlify.toml이 아니라 static/_redirects 에 둔다
#   (/reset-password.html → /reset-password). static/_redirects 내용이 catch-all보다 앞에 병합됨.
#
# 런타임 환경변수(사이트 env로 이미 설정되어 있어야 함, netlify.toml에 비밀값 금지):
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY  ← 라이브와 동일 값
#   APP_ORIGIN = https://jaree.kr   ← OAuth issuer/디스커버리·/api Origin정책 기준 (필수 일치)
[build]
  command = "npm run build"
  publish = "build"
