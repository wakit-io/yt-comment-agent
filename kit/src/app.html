<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="/uicons/uicons-regular-rounded.css" />
  <script>
    try {
      // 다크는 관리자/인증 화면에서만. 공개 랜딩은 항상 라이트(브랜드 톤 고정).
      var pth = location.pathname;
      var isApp = pth.indexOf('/admin') === 0 || pth.indexOf('/auth') === 0;
      var p = localStorage.getItem('fl-appearance') || 'system';
      var dark = isApp && (p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
      document.documentElement.dataset.appearance = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display:contents">%sveltekit.body%</div>
</body>
</html>
